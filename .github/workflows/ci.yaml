name: CI

# main への push でも走らせるのはキャッシュを作るためだ｡Actions のキャッシュ
# は branch ごとに隔離されていて､pull request が読めるのは自分のものと base
# branch のものだけになる｡pull request でしか走らなければキャッシュは
# `refs/pull/N/merge` にしか残らず､どの pull request も他の pull request の
# ものを読めない — つまり毎回ビルドを一から始めることになる｡
"on":
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 唯一の required check: `needs` のどれかが失敗したときだけ動き､そのとき
  # 意図的に失敗する｡branch protection は下の全ジョブを追う代わりに､この
  # 1 つのジョブを指せばよい｡
  ci-status-check:
    runs-on: ubuntu-latest
    if: failure()
    timeout-minutes: 10
    needs:
      - test
      - lint
      - dependency-review
    steps:
      - run: exit 1

  test:
    name: Test
    # gpui は `macos-blade` で､x11/wayland のスタック無しでビルドしている｡
    # だからこの crate は macOS でしかコンパイルできない｡
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      # 書き込むのは main だけで､pull request と merge queue は読むだけにする｡
      # pull request ごとに 1.6 GB を書くと 10 GB の上限で互いに追い出し合い､
      # 次の pull request がまた冷える｡代わりに残る trade-off が 1 つある:
      # main と Cargo.lock が違う pull request は､その差分を push のたびに
      # ビルドし直す (prefix での restore は効くので､一から建て直しはしない)｡
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --locked --all-targets

  # Dependabot の alert が見るのは default branch である｡こちらはそれを
  # 補うチェックで､既知の脆弱性を持つ依存を pull request が持ち込むのを
  # 防ぐ｡dependency review は pull request と merge queue のイベントが
  # 渡す base と head の依存グラフを比べる｡
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false

  # 報告のみで､意図的に `ci-status-check` の `needs` から外してある:
  # マージを止められない｡ルールは `metrics-baseline.tsv` が説明している —
  # 初日から落ちるチェックは直されずに無効化される — し､カバレッジの下限には
  # ファイルサイズのラチェットには無いもう一つの問題がある｡このアプリの
  # テスト不能な面は実在し文書化もされている (#115: メニューと､`Scene` から
  # 先のすべて)｡描画コードを足す PR は､それ自体に落ち度が無くても割合を
  # 下げる｡まず数字が先だ｡数字が揃えばラチェットは後から足せる｡#48 が
  # そう段階を踏んだのとまったく同じだ｡
  coverage:
    name: Coverage
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: llvm-tools-preview

      # ここに `rust-cache` を置かないのは意図的だ｡計測付きのビルドは専用の
      # target ディレクトリを使い (手元で 2.4 GB)､このリポジトリの Actions
      # キャッシュは GitHub の 10 GB 上限に対してすでに 9 GB ある — ここで
      # キャッシュすると Test と Lint のキャッシュを追い出し､レポートを速く
      # するために *それらの* ジョブを遅くすることになる｡冷えた状態の計測付き
      # ビルドは手元で約 1m40s｡ランナーはもっと遅いマシンだが､このジョブは
      # 何も止めない｡
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a  # v2.86.6
        with:
          tool: cargo-llvm-cov

      - name: Report coverage
        run: bash scripts/coverage.sh >> "$GITHUB_STEP_SUMMARY"

      # 上の計測は測り直さず使い回す: `coverage.sh` は profile をその場に
      # 残し､`COVERAGE_REUSE` はレポートまで直行するので､未カバー一覧に
      # 2 回目のビルドの代金はかからない｡
      - name: List uncovered functions
        env:
          COVERAGE_REUSE: "1"
        run: |
          {
            printf '\n<details><summary>Uncovered functions</summary>\n\n```\n'
            bash scripts/coverage.sh --gaps
            printf '```\n\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # スクリプトが読む json に加えて lcov も出す｡後で Codecov なり何なりに
      # 向けるときに､ここへ手を入れずに済むようにだ｡どちらもすでにディスクに
      # ある profile から作られる｡
      - name: Export lcov
        run: cargo llvm-cov report --lcov --output-path tmp/coverage/lcov.info

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: |
            tmp/coverage/lcov.info
            tmp/coverage/llvm-cov.json
          retention-days: 14

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy, rustfmt

      # Test ジョブと同じ理由で､書き込むのは main だけにする｡
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # #48: 構造メトリクス｡ゲートにはせず run summary へ報告する｡既存の
      # コードは設定する価値のあるどの閾値もすでに超えているし､初日から
      # 落ちるチェックは直されずに無効化される — だからまず baseline を
      # 立てる｡それが #48 の求めるものだ｡新しいジョブではなく lint ジョブに
      # 相乗りするのは､そのジョブの温まった clippy キャッシュを使い回せる
      # からだ｡別のランナーなら crate を一から建て直すことになる (#46)｡
      - name: Report code metrics
        run: bash scripts/code-metrics.sh >> "$GITHUB_STEP_SUMMARY"

      # #48 のゲートであり､ゲートである唯一のメトリクスだ｡関数の長さは
      # すでに `clippy::too_many_lines` (`pedantic` 経由で deny､#47) が
      # 強制しているし､認知的複雑度はゲートにするヒットが無い｡ファイル
      # サイズには実際の問題があり､既存のチェックが無い｡絶対値の上限では
      # なく `metrics-baseline.tsv` に対してラチェットするので､成長は
      # 可能だが決して黙ってはいない — 天井を超えるとここで落ち､通す道は
      # 同じ pull request で天井を上げることだけだ｡
      - name: Check file sizes against the baseline
        run: bash scripts/code-metrics.sh --check
