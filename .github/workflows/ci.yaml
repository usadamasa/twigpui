name: CI

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single required check: it runs only when one of `needs` failed, and then
  # fails on purpose. Branch protection can point at this one job instead of
  # tracking every job below.
  ci-status-check:
    runs-on: ubuntu-latest
    if: failure()
    timeout-minutes: 10
    needs:
      - test
      - lint
    steps:
      - run: exit 1

  test:
    name: Test
    # gpui is built with `macos-blade` and without the x11/wayland stacks, so
    # this crate only compiles on macOS.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Run tests
        run: cargo test --locked --all-targets

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # #48: structural metrics, reported into the run summary rather than
      # gated on. The existing code is already over any threshold worth
      # setting, and a check that fails from day one gets disabled instead
      # of fixed — so this establishes the baseline first, which is what
      # #48 asks for. It rides in the lint job rather than a new one
      # because it reuses that job's already-warm clippy cache; a separate
      # runner would rebuild the crate from scratch (#46).
      - name: Report code metrics
        run: bash scripts/code-metrics.sh >> "$GITHUB_STEP_SUMMARY"
