[package]
name = "twigpui"
version = "0.1.0"
edition = "2024"
publish = false

# `-D warnings` in CI turns every one of these into a build failure.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

[dependencies]
anyhow = "1.0.104"
# URL-safe, no-padding base64 for the PKCE verifier/challenge (RFC 7636 §4.1-4.2).
base64 = "0.23.1"
dotenvy = "0.15.7"
# Only a source of raw random bytes is needed (the PKCE verifier and the OAuth
# `state`), not the full `rand` API surface (distributions, seeding, shuffling
# helpers). `getrandom` covers exactly that, so it's used over `rand`.
getrandom = { version = "0.4.3", features = ["std"] }
# macos-blade renders through blade instead of pre-compiled Metal shaders, so
# the build needs no `xcrun metal` — which ships with full Xcode, not the
# Command Line Tools. x11/wayland are Linux-only and this project is macOS-only.
gpui = { version = "0.2.2", default-features = false, features = [
    "font-kit",
    "macos-blade",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.4"
ureq = { version = "3.4.0", features = ["json"] }
