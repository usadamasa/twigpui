[package]
name = "twigpui"
version = "0.1.0"
edition = "2024"
publish = false

# #267 の Float on Top のために `unsafe` を 1 か所へ閉じ込めた helper
# (`crates/window-level`)｡本体は `unsafe_code = "forbid"` のままでいられる｡
#
# `default-members` に両方を並べてあるので､CLAUDE.md の 3 コマンド
# (`cargo fmt --check` / `cargo clippy --all-targets -- -D warnings` /
# `cargo test`) と CI がそのまま helper も見る｡片方だけにすると､helper は
# 誰にも lint されないまま `unsafe` を抱えることになる｡
[workspace]
members = ["crates/window-level"]
default-members = [".", "crates/window-level"]

# `warn` ではなく `deny` (#47)｡CI は `cargo clippy -- -D warnings` を走らせる
# ので､ここに並ぶものはどれも手元では通るのに CI ではすでにビルド失敗だった —
# この非対称は､コードを書いたマシンで分かったはずのことを CI で知る羽目に
# なる､ということだった｡
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# 計測のうえで #47 が採用: どれも現在のツリーで発火が 0 回なので､今日の
# コストはゼロで､最初の 1 件を捕まえられる｡
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_crate_dependencies = "deny"
variant_size_differences = "deny"

# #47 が採用しなかったものと､そう決めた計測:
#
# - `let_underscore_drop` (`src/` で 26 件): どれも意図的な
#   `let _ = this.update(cx, …)` — gpui 自身の "the entity may already be
#   gone" の言い方だ｡採用すれば `#[allow]` が 26 個要る｡それは issue 自身が
#   挙げる､lint を採用しない理由そのものだ｡
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
# #47 が採用｡`indexing_slicing` と `string_slice` はタダではなかった —
# `browser::strip_scheme` でリモート入力による実際の panic を 1 件､
# `ui::format_timestamp` と `oauth::callback::percent_decode` で到達可能な
# ものをさらに 2 件見つけた｡残りは発火が 0 回だ｡
indexing_slicing = "deny"
string_slice = "deny"
panic = "deny"
unwrap_in_result = "deny"
float_cmp = "deny"
verbose_file_reads = "deny"
same_name_method = "deny"
missing_assert_message = "deny"
redundant_type_annotations = "deny"
# #47 の lint 作業の後半: `src/` のすべての算術演算が､オーバーフロー時に
# 何をするかを明示するようになった (飽和させる｡範囲がすでに起きないと証明して
# いる箇所では wrap する｡あるいは検査してフォールバックする)｡タイムスタンプは
# クロックと API のヘッダから来るし､バイトオフセットはリダイレクト URL から
# 来る — どれもこのコードが信用してよいものではない｡
arithmetic_side_effects = "deny"

# `--png` で fixture を window 無しに PNG へ描く経路 (#221, `src/headless_shot.rs`)｡
#
# 既定では立てない｡この経路が使う `HeadlessAppContext` と
# `current_headless_renderer` は gpui の `test-support` の内側にあり､それを素の
# `cargo build --release` に入れると `TestPlatform` ごと本番のバイナリへ載る｡
# dev-dependency では届かない — bin の `main` から呼ぶので､テストではない
# ビルドで feature を立てるしかない｡
#
# feature の裏のコードは既定の `cargo clippy --all-targets` が見ないので､
# CI の clippy は `--features headless-shot` を付けて呼ぶ
# (`.github/workflows/ci.yaml`)｡
[features]
headless-shot = ["gpui/test-support", "gpui_platform/test-support"]

# レイアウトと描画をする依存だけ最適化して積む｡`cargo test` の壁時計は
# 手元 (macOS, 1271 本) で 90.27s から 5.78s になる｡
#
# `#[gpui::test]` の animation は `advance_clock` で進むので､`advance_clock(2s)`
# 1 回がウィンドウを 21 フレーム描き直す｡40 件の fixture の 1 フレームに
# 未最適化では 350ms (1 行 8.2ms) かかり､これが 11 本のテストだけで 172 秒を占める｡
# 時間はほぼ全部が taffy のレイアウトと gpui の描画の中にある — 行を空の div に
# 差し替えると 40 件の draw が 328ms から 3.4ms まで落ちるので､こちらの
# `render` の組み立てではない｡
#
# 効きの内訳: 素が 90.27s､gpui-pre だけ最適化して 20.67s､taffy も足して 5.78s｡
# この 2 つだけにしてあるので､CI の cold build で余分に最適化されるのもこの 2 つだけ｡
# `debug-assertions` は dev profile の既定のまま触らない｡
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[dependencies]
anyhow = "1.0.104"
# PKCE の verifier/challenge 用の URL-safe でパディング無しの base64 (RFC 7636 §4.1-4.2)｡
base64 = "0.23.1"
# #195: `created_at` を `Asia/Tokyo` へ直して表示する｡
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10.4", default-features = false }
# #175 の手動 scroll｡Ryan Juckett の減衰調和振動子を､1 フレームぶんの
# 係数に畳んだ閉じた形で解く (`ui::scroll`)｡指数関数で目標へ寄せるのと
# 違って速度が状態として残るので､静止から加速し､途中で目標が変わっても
# 速度が跳ねない — そこが「なめらか」の中身｡
#
# 版を `=` で固定する｡ここが返す係数がそのまま画面の動きなので､patch
# 更新でも手触りが変わりうる｡上げるときは目で見て決める｡
#
# 同じ解法の crate では `damped-springs` を先に読み､採らなかった:
# 臨界減衰 (ζ = 1) の係数が Juckett の `timeExpFreq + expTerm` を
# `* expTerm` と書き違えていて､dt = 0 で位置が 0 に飛ぶ｡ここが使うのは
# ちょうどその ζ = 1｡
charmed-harmonica = "=0.2.3"
dotenvy = "0.15.7"
# OAuth の token を型で秘匿する (#246)｡`Secret<T>` の `Debug` は中身を出さず、
# 出口は `expose_secret()` だけ — `Deref` も `AsRef` も無いので、うっかり
# `String` に戻ることがない｡`log::redact` の文字列スキャンとは別の防御線で、
# こちらはパース済みのフィールドを、あちらは未パースの body を守る｡
#
# `secrecy` を先に読み、採らなかった: `SecretString` は `PartialEq` を持たず、
# `Serialize` が orphan rule で塞がっているので、ディスクへ保存する
# `oauth::TokenSet` が組み立てられない｡
#
# drop 時の zeroize (`zeroize` feature) は入れない｡token はプロセスの一生ぶん
# 生きて、どのみち 0600 のファイルに載っている｡守る相手はログの漏洩であって
# メモリフォレンジックではない｡
redact = { version = "0.1.11", features = ["serde"] }
# 必要なのは生のランダムバイトの供給源だけで (PKCE の verifier と OAuth の
# `state`)､`rand` の API 全面 (分布､シード､シャッフル補助) ではない｡
# `getrandom` がちょうどそこを覆うので､`rand` ではなくこちらを使う｡
getrandom = { version = "0.4.3", features = ["std"] }
# `gpui-pre` 自身は `font-kit` を optional dependency として宣言しているが
# (`cargo-shear` の ignored リストに載っている理由もそれ)､それを使う cfg は
# crate 自身のソースのどこにも無い — 実際に読むのは `gpui_platform` 経由の
# `gpui_macos` (下) なので､ここでは立てない｡
#
# 版を `=` で固定する (下の `gpui_platform` と dev-dependencies も)｡gpui-pre は
# zed の main の snapshot で､0.3.x の中でも API が変わる｡gpui-component 0.6.4 は
# `^0.3.5` としか言わないので､固定しないと lock を作り直したときに 0.3.6 を拾い､
# gpui-component がコンパイルできなくなる (`register_inspector_element` の
# クロージャの引数が変わった)｡上げるときは gpui-component が通る版と揃える｡
gpui = { package = "gpui-pre", version = "=0.3.5", default-features = false }
# runtime_shaders: プリコンパイル済みの Metal シェーダではなく実行時コンパイルで
# 描画するので､ビルドに `xcrun metal` が要らない — あれは Command Line Tools では
# なく完全な Xcode に付いてくる｡x11/wayland は Linux 専用で､このプロジェクトは
# macOS 専用だ｡
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5", features = [
    "font-kit",
    "runtime_shaders",
] }
gpui-component = "0.6.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.4"
ureq = { version = "3.4.0", features = ["json"] }
# #267 の Float on Top｡gpui-pre には window を開いた後に level を動かす口が
# 無いので､`NSWindow` の level だけを差し替える｡`unsafe` はこの crate の中の
# 1 か所に閉じてある (crate の doc を見よ)｡
window-level = { path = "crates/window-level" }

# これを必要とするのは起動の smoke test (#59) だけだ｡`test-support` は
# `TestAppContext` を引き込む｡そのウィンドウ実装はどこにも描画しないので
# (gpui の `platform/test/window.rs` で `TestWindow::draw` は no-op)､
# テストは GPU もウィンドウサーバも無しにウィンドウを開いて 1 フレーム描ける｡
# この経路は `cargo test` がそれまで一度も覆っていなかったところで､#55 が
# 隠れていた場所だ: 実際に何かが描画されて初めて到達する panic｡
[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.5", default-features = false, features = [
    "test-support",
] }
